<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InterviewAI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-neon: #00f0ff;
            --secondary-neon: #ff00ff;
            --accent-neon: #00ff88;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(20, 20, 35, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at top, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(255, 0, 255, 0.1) 0%, transparent 50%);
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Neon Glow Effects */
        .neon-glow {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5),
                        0 0 40px rgba(0, 240, 255, 0.3),
                        0 0 60px rgba(0, 240, 255, 0.1);
        }

        .neon-glow-purple {
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5),
                        0 0 40px rgba(255, 0, 255, 0.3),
                        0 0 60px rgba(255, 0, 255, 0.1);
        }

        .neon-glow-green {
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5),
                        0 0 40px rgba(0, 255, 136, 0.3),
                        0 0 60px rgba(0, 255, 136, 0.1);
        }

        /* Buttons */
        .btn-neon {
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            border: none;
            color: var(--bg-dark);
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-neon:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            color: var(--bg-dark);
        }

        .btn-neon-outline {
            background: transparent;
            border: 2px solid var(--primary-neon);
            color: var(--primary-neon);
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-neon-outline:hover {
            background: var(--primary-neon);
            color: var(--bg-dark);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
        }

        /* Form Inputs */
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: var(--text-primary);
            padding: 15px 20px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-neon);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: var(--text-secondary);
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 255, 0.2));
            color: var(--primary-neon);
            border: 1px solid var(--primary-neon);
        }

        .sidebar-link i {
            margin-right: 15px;
            font-size: 1.2rem;
        }

        /* Category Cards */
        .category-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .category-card:hover::before {
            left: 100%;
        }

        .category-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-neon);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .category-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .category-python { color: #3776ab; }
        .category-django { color: #092e20; }
        .category-hr { color: #ff6b6b; }
        .category-web { color: #f39c12; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease forwards;
        }

        .animate-pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        /* Progress Bar */
        .progress {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--primary-neon), var(--secondary-neon));
            transition: width 0.5s ease;
        }

        /* Table Styles */
        .table-dark-custom {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .table-dark-custom th {
            border-color: var(--glass-border);
            color: var(--primary-neon);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .table-dark-custom td {
            border-color: var(--glass-border);
            color: var(--text-secondary);
        }

        /* Alert Styles */
        .alert-custom {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: var(--text-primary);
        }

        .alert-success-custom {
            border-color: var(--accent-neon);
            background: rgba(0, 255, 136, 0.1);
        }

        .alert-error-custom {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-neon);
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                min-height: auto;
                padding: 20px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if user.is_authenticated %}
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <div class="text-center mb-4">
                    <h2 class="fw-bold" style="color: var(--primary-neon);">
                        <i class="fas fa-robot"></i> InterviewAI
                    </h2>
                </div>
                
                <nav class="nav flex-column">
                    <a href="{% url 'dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                    <a href="{% url 'interview_history' %}" class="sidebar-link {% if request.resolver_match.url_name == 'interview_history' %}active{% endif %}">
                        <i class="fas fa-history"></i> History
                    </a>
                    <a href="{% url 'profile' %}" class="sidebar-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <hr style="border-color: var(--glass-border); margin: 20px 0;">
                    <a href="{% url 'logout' %}" class="sidebar-link">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </nav>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    {% else %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
